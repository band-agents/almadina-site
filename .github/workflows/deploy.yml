# Build the site and publish it to GitHub Pages.
#
# The repository holds source, not a build. Pointing Pages at "deploy from a
# branch" therefore serves index.html with its <script src="/src/main.tsx">
# intact — the browser cannot execute TypeScript, so the page renders white.
# This workflow builds first and publishes only dist/.
#
# After merging this, set Settings -> Pages -> Source to "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # The repo publishes to /<repo-name>/, so asset URLs need that prefix.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_HIS_URL: ${{ vars.VITE_HIS_URL }}

      - name: Add SPA fallback
        # GitHub Pages serves static files only: a deep link like /doctors has
        # no file behind it and 404s. Pages serves 404.html for any miss, so a
        # copy of index.html there lets the client-side router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
